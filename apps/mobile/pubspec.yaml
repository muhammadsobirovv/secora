name: pentesthub_mobile
description: >
  PentestHub AI — official cross-platform mobile app (Android/iOS). Complements
  the Web Dashboard (apps/web) and Desktop Agent (apps/desktop): monitor
  engagements, chat with the AI Security Copilot, review findings, capture
  evidence, and manage projects, online or offline.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

# NOTE (Module 12 verification section / ADR 0012): this sandbox cannot run
# `flutter pub get` — the Flutter engine/Dart-SDK artifact host
# (storage.googleapis.com) is blocked by the sandbox's network allowlist, so
# there is no `flutter` binary to invoke. Every version constraint below was
# chosen from each package's real, well-established stable major line rather
# than verified against a live pub.dev resolution — run `flutter pub get` on
# a real machine before first build; see docs/mobile/flutter-development-guide.md.

dependencies:
  flutter:
    sdk: flutter
  # Module 15 — task #348 "i18n architecture". Provides
  # GlobalMaterialLocalizations/GlobalWidgetsLocalizations/
  # GlobalCupertinoLocalizations — wired into MaterialApp.router in
  # app.dart. Ships as part of the Flutter SDK itself (no pub.dev
  # resolution needed), so unlike every other dependency in this file it
  # doesn't carry the "unverified against a live resolution" caveat above.
  flutter_localizations:
    sdk: flutter

  # --- State management / navigation / codegen -------------------------------
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # --- Networking --------------------------------------------------------------
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3

  # --- Local storage (offline-first: Hive for key-value/blob cache + queue,
  # sqflite for relational/searchable offline data) -----------------------------
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3

  # --- Security ------------------------------------------------------------------
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.2.0
  crypto: ^3.0.3
  flutter_jailbreak_detection: ^1.10.0

  # --- Evidence capture --------------------------------------------------------
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  file_picker: ^8.0.6
  mobile_scanner: ^5.2.3
  record: ^5.1.2
  video_player: ^2.9.1

  # --- Voice -----------------------------------------------------------------
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2

  # --- Rich content rendering (AI chat) ------------------------------------------
  flutter_markdown: ^0.7.3
  markdown: ^7.2.2
  flutter_highlight: ^0.7.0
  webview_flutter: ^4.9.0

  # --- Charts (Analytics feature) -------------------------------------------
  fl_chart: ^0.68.0

  # --- Notifications -----------------------------------------------------------
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4
  flutter_local_notifications: ^17.2.2

  # --- Files / sharing / device info ---------------------------------------------
  open_filex: ^4.5.0
  share_plus: ^9.0.0
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.0
  permission_handler: ^11.3.1
  # Module 14 — Auto Update: opens the app store listing from the
  # "update available" dialog (core/updates/app_update_service.dart).
  url_launcher: ^6.3.0

  # --- Background sync ---------------------------------------------------------
  workmanager: ^0.5.2

  # --- Misc -------------------------------------------------------------------
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  uuid: ^4.4.0
  logging: ^1.2.0
  equatable: ^2.0.5
  collection: ^1.18.0
  flutter_svg: ^2.0.10+1
  shared_preferences: ^2.2.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  build_runner: ^2.4.11
  freezed: ^2.5.5
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  golden_toolkit: ^0.15.0

flutter:
  uses-material-design: true
  # Module 15 — task #348. Turns on codegen for the app's own string
  # catalog (lib/l10n/*.arb, configured by l10n.yaml at the repo root of
  # this package) into a generated `AppLocalizations` class. Requires
  # `flutter gen-l10n` (or any `flutter build`/`flutter run`, which runs it
  # automatically) — this sandbox cannot do that (see the top-of-file
  # comment), so `AppLocalizations` does not exist yet anywhere in this
  # repo and nothing here imports it. Run once on a real machine, then wire
  # `AppLocalizations.delegate` into `app.dart`'s `localizationsDelegates`
  # list and start replacing hardcoded strings screen by screen — see
  # docs/architecture/i18n.md.
  generate: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
