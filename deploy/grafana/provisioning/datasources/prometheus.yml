# PentestHub AI — Grafana datasource provisioning (Module 14: Monitoring).
# Auto-loaded by Grafana on startup (mounted at
# /etc/grafana/provisioning/datasources/ — see docker-compose.monitoring.yml)
# so a fresh Grafana container is already wired to the bundled Prometheus
# with zero manual setup.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
