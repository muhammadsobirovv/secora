# PentestHub AI — nginx load balancer config for the
# docker-compose.enterprise.yml overlay's `lb` service (Module 14: High
# Availability). Fronts a `docker compose --scale api=N` group.
#
# Docker Compose has no built-in load balancer — with N `api` replicas
# scaled via `--scale`, the service name `api` resolves (via Compose's
# embedded DNS at 127.0.0.11) to N A-records, and a naive
# `proxy_pass http://api:3000` would only ever pick the first one
# nginx's DNS cache resolved at startup. Using a `resolver` directive
# plus a variable in `proxy_pass` forces nginx to re-resolve on every
# request (respecting the DNS response TTL), which is what actually
# distributes load across replicas as they're added/removed. This is a
# well-known Compose+nginx pattern, not a Kubernetes Service — for a
# real production load balancer with health-aware routing, see
# deploy/k8s/10-api-deployment.yaml's Service instead.

resolver 127.0.0.11 valid=10s;

server {
    listen 3000;

    location / {
        set $upstream_api api:3000;
        proxy_pass http://$upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE streaming (Module 5's chat/AI streaming endpoints) needs
        # buffering off and no read timeout cap, or nginx will either
        # chunk-delay tokens or kill a long-idle-between-tokens stream.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /observability/health {
        set $upstream_api api:3000;
        proxy_pass http://$upstream_api;
        access_log off;
    }
}
