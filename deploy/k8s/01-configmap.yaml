# Non-secret configuration, shared by the api/worker Deployments via
# `envFrom`. Secret values (JWT_ACCESS_SECRET, CREDENTIAL_ENCRYPTION_KEY,
# DATABASE_URL, OAuth client secrets) live in 02-secret.yaml instead —
# never in this file, since ConfigMaps are neither encrypted at rest by
# default nor access-restricted the way Secrets are (RBAC can, and
# should, restrict `get`/`list` on Secrets more tightly than on
# ConfigMaps in a real cluster policy).
apiVersion: v1
kind: ConfigMap
metadata:
  name: pentesthub-config
  namespace: pentesthub
data:
  NODE_ENV: "production"
  PORT: "3000"
  FRONTEND_URL: "https://app.your-company.com"
  # One hop — this manifest set assumes an Ingress controller (nginx,
  # Traefik, cloud LB) sits directly in front of the api Service. Adjust
  # if there's an additional proxy layer (a CDN in front of the
  # Ingress, etc.) — see TRUST_PROXY_HOPS's doc comment in
  # apps/api/src/config/env.validation.ts.
  TRUST_PROXY_HOPS: "1"
  LOG_LEVEL: "info"
  # Sized for `replicas: 3` (see api-deployment.yaml) against a Postgres
  # instance with max_connections comfortably above 3 * 15 = 45 once the
  # worker Deployment's own pool and admin connections are accounted
  # for — see DATABASE_POOL_MAX's doc comment in env.validation.ts for
  # how to resize this if replica count changes.
  DATABASE_POOL_MAX: "15"
  WORKER_DATABASE_POOL_MAX: "5"
  # --- Module 14: Cloud Platform / Enterprise SaaS ---
  # "community" (default, zero paid dependencies) or "enterprise" — see
  # apps/api/src/modules/infrastructure/edition.service.ts. Setting this
  # to "enterprise" alone does nothing without at least one active
  # License row; it only changes the *fallback* used when no License
  # exists, which stays permissive ("trusted environment") specifically
  # so a self-hosted cluster is never locked out — see that service's
  # doc comment.
  PENTESTHUB_EDITION: "community"
  # Provider selection for the pluggable abstractions in
  # apps/api/src/common/providers/ — each defaults to the Community
  # Edition, zero-external-dependency binding. Uncomment the Enterprise
  # values (and apply 13-redis.yaml / a real S3-compatible bucket) for
  # a multi-replica cluster; see this manifest set's README for when
  # that's necessary vs. optional.
  # Module 14 — Community Edition guarantee pass: fixed from "in-memory"
  # to "memory" — env.validation.ts's zod schema only accepts
  # `'memory' | 'redis'`; the old value would have failed
  # `validateEnv()` at boot with "Invalid environment configuration" the
  # moment anyone applied this ConfigMap as shipped.
  QUEUE_PROVIDER: "memory" # or "redis" — required once replicas > 1, since in-memory queues aren't shared across pods
  CACHE_PROVIDER: "memory" # or "redis" / "disk"
  STORAGE_PROVIDER: "local" # or "s3" — required once replicas > 1, since local-disk storage isn't shared across pods without a ReadWriteMany volume
  # STORAGE_S3_ENDPOINT: "https://minio.your-cluster.svc:9000"
  # STORAGE_S3_REGION: "us-east-1"
  # STORAGE_S3_BUCKET: "pentesthub"
  # STORAGE_S3_FORCE_PATH_STYLE: "true"
  # --- Module 15/20: Billing — "none" (default) is Community Edition:
  # BillingService still creates a real Subscription row per
  # organization, pinned to PlanTier.FREE, it just never calls out to a
  # payment provider. Set to "stripe" and provide the STRIPE_* secrets
  # (02-secret.yaml.example) to accept real payments. ---
  BILLING_PROVIDER: "none" # or "stripe" / "manual"
