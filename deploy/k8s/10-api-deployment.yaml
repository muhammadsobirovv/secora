# The API server tier. `replicas: 3` is the reference HA topology this
# whole manifest set (and PollerLeaseService — see
# apps/api/src/common/concurrency/poller-lease.service.ts) is designed
# around; every `setInterval`-based poller in this codebase is safe to
# run at any replica count because of that service, and readiness/
# liveness below use Module 10's Observability health endpoints so a
# replica that can't reach Postgres is pulled out of rotation without
# being killed (see health.controller.ts's doc comment for the
# liveness-vs-readiness distinction this relies on).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: pentesthub
  labels:
    app: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  strategy:
    rollingUpdate:
      maxUnavailable: 0 # never drop below full capacity mid-rollout
      maxSurge: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: api
    spec:
      # Spreads replicas across nodes so a single node failure can't take
      # out more than one replica — `ScheduleAnyway` (not `DoNotSchedule`)
      # so this remains a soft preference on small clusters that don't
      # have 3+ schedulable nodes rather than a hard scheduling failure.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: api
      containers:
        - name: api
          image: ghcr.io/pentesthub-ai/pentesthub-ai-api:latest # replace with the image the docker-publish.yml workflow pushed, pinned to a tag/digest — not `latest` — for any real deployment
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: pentesthub-config
            - secretRef:
                name: pentesthub-secrets
          # Module 14 — Startup Checks. Kubernetes' own model for
          # "startup" is distinct from liveness in *timing*, not
          # necessarily in *what* it checks: a startupProbe disables the
          # liveness/readiness probes entirely until it succeeds once,
          # giving a slow-starting process (Prisma client generation,
          # Prisma engine warm-up, module initialization) as long as
          # `failureThreshold * periodSeconds` to come up without a
          # liveness probe prematurely killing it mid-boot. Reusing the
          # liveness handler here (rather than inventing a separate
          # endpoint with different logic) is the correct, idiomatic
          # pattern — see the Kubernetes docs' own "protect slow starting
          # containers" example, which does exactly this.
          startupProbe:
            httpGet:
              path: /observability/health
              port: 3000
            periodSeconds: 5
            failureThreshold: 30 # up to 150s to come up before liveness takes over
          readinessProbe:
            httpGet:
              path: /observability/health/ready
              port: 3000
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /observability/health
              port: 3000
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              memory: "768Mi"
          # SIGTERM triggers Nest's shutdown hooks (see main.ts's
          # `app.enableShutdownHooks()`), which runs every service's
          # `onModuleDestroy` (clearing poller intervals, releasing this
          # replica's PollerLeaseService holds early, closing the Prisma
          # connection pool) before the process exits — the default grace
          # period below gives that an honest chance to finish an
          # in-flight webhook delivery/workflow step rather than being
          # SIGKILLed mid-request.
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: pentesthub
  annotations:
    # Module 14 — Monitoring. Standard `prometheus.io/*` scrape
    # annotations, auto-discovered by kube-prometheus-stack (or any
    # Prometheus configured with the equally-standard
    # `kubernetes_sd_configs` relabeling rules for them) without needing
    # a bespoke ServiceMonitor CRD or a Prometheus this manifest set
    # deploys itself — see deploy/prometheus/README.md for why a
    # from-scratch Prometheus/Grafana/Alertmanager StatefulSet isn't
    # included here the way postgres/redis/minio are.
    prometheus.io/scrape: "true"
    prometheus.io/path: /observability/metrics
    prometheus.io/port: "3000"
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: pentesthub
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    # Scale up fast (a traffic spike shouldn't wait), scale down slowly
    # (avoids flapping replica count on noisy/bursty load) — standard HPA
    # tuning, not specific to this app.
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 0
