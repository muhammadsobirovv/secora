# The Next.js web frontend tier.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: pentesthub
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: ghcr.io/pentesthub-ai/pentesthub-ai-web:latest # replace with a pinned tag/digest — also rebuild with the correct NEXT_PUBLIC_API_URL build-arg for your environment, since Next.js inlines it at build time (see apps/web/Dockerfile's comment)
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: HOSTNAME
              value: "0.0.0.0"
          readinessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: pentesthub
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 3001
      targetPort: 3001
