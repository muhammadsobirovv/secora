# The background worker tier (`worker.main.ts` — Modules 3/4's Recon/
# Vuln ToolRunner execution loop), separate from the api Deployment so
# a long-running tool execution never competes with request-handling
# latency. No Service/Ingress — this tier isn't addressed over HTTP by
# anything, it only reads/writes the shared Postgres database.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: pentesthub
  labels:
    app: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/pentesthub-ai/pentesthub-ai-worker:latest # replace with a pinned tag/digest for any real deployment
          envFrom:
            - configMapRef:
                name: pentesthub-config
            - secretRef:
                name: pentesthub-secrets
          resources:
            requests:
              cpu: "500m" # tool execution (nmap, subfinder, etc. — see apps/api/src/modules/recon) is CPU-heavier than the API's own request handling
              memory: "512Mi"
            limits:
              memory: "1Gi"
      terminationGracePeriodSeconds: 60 # longer than the API's — an in-progress recon/vuln tool run should be allowed to reach a natural checkpoint rather than being killed mid-scan
---
# Module 14 — worker autoscaling. Disabled by default in spirit (this
# manifest is opt-in: apply it once QUEUE_PROVIDER is something other
# than the pod-local "in-memory" default, since scaling worker replicas
# only helps throughput when jobs are dispatched through a shared
# queue/DB — see Module 10's DistributedJob system and Module 14's
# QueueService, both already safe at any replica count via
# WorkerNode heartbeat/lease semantics). CPU-based, same shape as the
# api Deployment's HPA in 10-api-deployment.yaml, just a wider ceiling
# since scan tool execution is bursty by nature (a large recon job can
# legitimately need many more workers than steady-state).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker
  namespace: pentesthub
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 0
