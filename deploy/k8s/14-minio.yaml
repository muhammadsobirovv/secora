# MinIO for STORAGE_PROVIDER=s3 (Module 14 — see
# apps/api/src/common/providers/storage/s3-compatible-storage.service.ts,
# which uses @aws-sdk/client-s3 and is equally happy talking to real
# AWS S3, Cloudflare R2, or Azure Blob's S3-gateway — MinIO here is
# just the free/self-hosted option for Community/Enterprise clusters
# that don't want to depend on a cloud object store). Optional: only
# needed once the api/worker Deployments run more than one replica
# each — see 01-configmap.yaml's comment on STORAGE_PROVIDER.
#
# Single replica, no erasure-coded distributed mode — a starting
# point, same caveat as 13-redis.yaml and 03-postgres.yaml. MinIO
# itself supports a real distributed/erasure-coded mode across 4+
# nodes for production use; that topology is out of scope for this
# manifest set. Prefer a managed object store (S3, R2, GCS) for a real
# production Enterprise deployment where object durability matters —
# see STORAGE_PROVIDER's other options in env.validation.ts.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: pentesthub
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: pentesthub-secrets
                  key: STORAGE_S3_ACCESS_KEY_ID
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pentesthub-secrets
                  key: STORAGE_S3_SECRET_ACCESS_KEY
          ports:
            - containerPort: 9000
            - containerPort: 9001
          volumeMounts:
            - name: minio-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              memory: "1Gi"
  volumeClaimTemplates:
    - metadata:
        name: minio-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi # workspace evidence/attachments + backup archives — resize per deployment
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: pentesthub
spec:
  clusterIP: None
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
# One-shot Job creating the app bucket on first deploy — MinIO doesn't
# auto-create buckets. Safe to re-run (`mc mb --ignore-existing`);
# `kubectl delete job minio-init -n pentesthub` before re-applying if
# you need to run it again after editing the bucket name.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: pentesthub
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:latest
          command:
            - /bin/sh
            - -c
            - >
              mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" &&
              mc mb --ignore-existing local/"${BUCKET:-pentesthub}"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: pentesthub-secrets
                  key: STORAGE_S3_ACCESS_KEY_ID
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pentesthub-secrets
                  key: STORAGE_S3_SECRET_ACCESS_KEY
            - name: BUCKET
              valueFrom:
                configMapKeyRef:
                  name: pentesthub-config
                  key: STORAGE_S3_BUCKET
                  optional: true
