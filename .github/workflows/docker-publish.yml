name: Docker Publish

# Module 10 — CI/CD, extended by Module 14 (SBOM, container signing,
# image scanning). Builds and pushes the three deployable container
# images (api, worker, web) to GitHub Container Registry. Runs only
# after `main` has an image-worthy change, and on version tags for
# release builds — this is deliberately separate from ci.yml so a
# docs-only PR never triggers a multi-gigabyte image build/push.
#
# Module 14 additions to each image, all using free/no-account-required
# tooling (Community Edition guarantee — no mandatory paid service):
#  - SBOM + build provenance attestations, generated natively by
#    BuildKit (`sbom: true`/`provenance: true` on build-push-action) —
#    no extra tool/service, just a BuildKit feature flag.
#  - Trivy vulnerability scan (aquasecurity/trivy-action, a local binary
#    scan against the just-built image, no external service/account) —
#    results uploaded as a SARIF report to GitHub's own code-scanning UI
#    (free on public repos; included in GHAS for private repos a
#    deployment may already have, not a new paid dependency this
#    pipeline introduces).
#  - cosign keyless signing (sigstore/cosign-installer + `cosign sign`
#    using GitHub's own OIDC token as the signing identity via Fulcio/
#    Rekor's public-good instances) — no private key to generate,
#    store, or rotate, and no paid signing service.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false # never cancel a half-pushed release image

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}/pentesthub-ai

jobs:
  build-and-push:
    name: Build & push ${{ matrix.component }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing — OIDC token to Fulcio
      security-events: write # upload Trivy SARIF to code scanning
    strategy:
      matrix:
        include:
          - component: api
            dockerfile: apps/api/Dockerfile
          - component: worker
            dockerfile: apps/api/Dockerfile.worker
          - component: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-${{ matrix.component }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions' own layer cache backend — no extra
          # infrastructure (a self-hosted registry cache, S3 bucket,
          # etc.) required, at the cost of the cache being scoped to
          # this repo's Actions runs rather than shared across a fleet.
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          build-args: |
            ${{ matrix.component == 'web' && format('NEXT_PUBLIC_API_URL={0}', vars.NEXT_PUBLIC_API_URL || 'https://api.your-company.com') || '' }}
          # Module 14 — SBOM: a native BuildKit attestation, not a
          # separate SBOM-generation tool run afterward — attached to
          # the pushed image manifest so `docker buildx imagetools
          # inspect --format '{{ json .SBOM }}' <image>` (or `cosign
          # download sbom`) retrieves it directly from the registry.
          sbom: true
          provenance: true

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-${{ matrix.component }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          # Informational for now, mirroring security-scan.yml's
          # `pnpm audit --audit-level high`/`continue-on-error: true`
          # posture — surfaces findings in the code-scanning UI without
          # blocking a release on a base-image CVE that may not be
          # realistically exploitable in this app's usage, until a
          # triage process is in place (see docs/deployment's Security
          # Review recommendation to make both blocking eventually).
          exit-code: "0"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.component }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless, OIDC)
        # Only on a genuine publish (push already gates this whole job,
        # but cosign needs the exact digest just pushed, not a tag alias
        # that could be re-pointed later) — signs the immutable
        # digest reference `steps.build.outputs.digest` gives us.
        run: |
          cosign sign --yes \
            "${REGISTRY}/${IMAGE_NAMESPACE}-${COMPONENT}@${DIGEST}"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAMESPACE: ${{ env.IMAGE_NAMESPACE }}
          COMPONENT: ${{ matrix.component }}
          DIGEST: ${{ steps.build.outputs.digest }}
          COSIGN_EXPERIMENTAL: "1"
