name: Mobile CI

# Module 12 — Cross-Platform Mobile Application. apps/mobile is a Flutter
# project, not a pnpm workspace member (Turborepo's task graph in ci.yml
# only covers apps/api, apps/web, packages/*, sdks/* — Flutter has its own
# toolchain and dependency manager), so it gets its own workflow file
# rather than a job bolted onto ci.yml.
#
# This file could not be executed or dry-run in the sandbox this module was
# authored in (no Flutter SDK — see docs/modules/12-mobile-application.md's
# Verification section for the full account, same disclosed-limitation
# pattern as sdks/go/README.md's own history before a real Go toolchain
# became available). Written against Flutter/Dart's real, documented GitHub
# Actions conventions (subosito/flutter-action, standard `flutter build`
# invocations) and should be treated as unverified until it runs green once
# on a real push.
on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-ci.yml"

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.24.0"

defaults:
  run:
    working-directory: apps/mobile

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      # Freezed/riverpod_generator/json_serializable codegen — see
      # docs/mobile/flutter-development-guide.md "Code generation". A no-op
      # if this pass added no @freezed/@riverpod-annotated sources yet.
      - run: dart run build_runner build --delete-conflicting-outputs
        continue-on-error: true
      - run: flutter analyze --fatal-infos

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter test --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: apps/mobile/coverage/lcov.info

  android-build:
    name: Android build (APK + AAB)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      # Release signing needs a real keystore — supplied via repository
      # secrets (ANDROID_KEYSTORE_BASE64/ANDROID_KEYSTORE_PASSWORD/
      # ANDROID_KEY_ALIAS/ANDROID_KEY_PASSWORD) at release-tag time; a
      # plain push/PR build uses Flutter's debug-signed default so CI stays
      # green without secrets configured on every fork/branch.
      - name: Decode release keystore (if configured)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            apps/mobile/build/app/outputs/flutter-apk/*.apk
            apps/mobile/build/app/outputs/bundle/release/*.aab

  ios-build:
    name: iOS build (no codesign)
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      # `--no-codesign` validates that the iOS build configuration itself
      # (Podfile, Info.plist, Xcode project settings) is sound without
      # needing an Apple Developer signing identity/provisioning profile in
      # CI — matching this task's "iOS build configuration is valid" gate.
      # A real signed IPA for TestFlight/App Store needs Fastlane match
      # (see ios/fastlane/Fastfile) with APPLE_ID/MATCH_* secrets configured.
      - run: flutter build ios --release --no-codesign
