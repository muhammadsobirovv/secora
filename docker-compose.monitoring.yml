# PentestHub AI — Monitoring overlay (Module 14: Monitoring). Adds
# Prometheus + Grafana + Alertmanager on top of the base
# docker-compose.yml (and, optionally, docker-compose.enterprise.yml —
# all three overlays compose freely since none of them redefine the
# same service names). Entirely optional — Community Edition is fully
# functional without it; this exists because "how do I actually look at
# the metrics /observability/metrics already exposes" is a real
# question the base compose file alone doesn't answer.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml \
#     --env-file .env up -d --build
#
# Grafana: http://localhost:3002 (default login admin / see
# GRAFANA_ADMIN_PASSWORD below — change it before exposing this beyond
# localhost). Prometheus: http://localhost:9090. Alertmanager:
# http://localhost:9093.
services:
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "127.0.0.1:9090:9090"

  alertmanager:
    image: prom/alertmanager:latest
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    ports:
      - "127.0.0.1:9093:9093"

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3002:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
