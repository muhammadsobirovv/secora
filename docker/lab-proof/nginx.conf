# Lab only. Serves the ownership proof file (written by the e2e run) and passes
# everything else to Juice Shop, so DEEP can be exercised against the lab with the
# file method. Reachable as http://proof.lab.test:3301 from the worker (the lab network) and, with the
# e2e resolver preload, from the API on the host (127.0.0.1:3301).
server {
    listen 80;
    # also on the published port, so the same URL works from the host (through the published
    # port) and from the lab network
    listen 3301;
    # the ownership probe only speaks https on 443, like it does on the real internet
    listen 443 ssl;
    ssl_certificate /tls/cert.pem;
    ssl_certificate_key /tls/key.pem;
    server_name _;

    location = /.well-known/secora-verify.txt {
        root /www;
        default_type text/plain;
        add_header Cache-Control "no-store";
    }

    location / {
        proxy_pass http://juice:3000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }
}
